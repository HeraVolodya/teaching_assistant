# Збірка інсталяторів «Асістента».
#
# ЧОМУ ЦЕ ІСНУЄ. Tauri не підтримує крос-компіляцію: Windows-збірку можна
# зробити лише на Windows, macOS — лише на macOS. Матриця нижче — єдиний
# спосіб отримати обидва інсталятори з одного тегу.
#
# ЧОМУ ЦЕ ЧАСТО ЄДИНИЙ СПОСІБ ЗІБРАТИ ВЗАГАЛІ. На машині розробника з
# увімкненим Smart App Control (Windows 11) `rustc` не запускається: він
# вантажить непідписану `rustc_driver-*.dll`, і політика цілісності коду її
# блокує (подія 3077 у Microsoft-Windows-CodeIntegrity/Operational, код
# виходу 0xc0e90002). Вимкнути Smart App Control можна лише НЕЗВОРОТНО —
# повернути його дає тільки перевстановлення Windows. Тому збірка тут.
#
# МОДЕЛЕЙ У ЗБІРЦІ НЕМАЄ. `models/` важить ~2.8 ГБ (див. коментар у
# scripts/fetch_models.py про занижену оцінку в DEPLOY.md), а бюджет
# інсталятора — 900 МБ. Моделі їдуть на носії окремо й підхоплюються
# майстром першого запуску, який звіряє SHA-256 кожного файлу.

name: release

on:
  push:
    tags: ["v*"]
  # Ручний запуск: зібрати інсталятор без тегу, щоб перевірити складання.
  workflow_dispatch:
    inputs:
      version:
        description: "Версія для імені артефакту (без тегу)"
        required: false
        default: "dev"

permissions:
  contents: write

# UTF-8 ДЛЯ ВСІХ КРОКІВ, А НЕ ДЛЯ ОДНОГО СКРИПТА.
# На windows-раннері `sys.stdout` має кодування cp1252 з обробником `strict`,
# тому будь-який не-ASCII символ валить процес. Увесь вивід скриптів тут
# українською, тож це не окремий баг, а клас: `check_size_budget.py` уже впав на
# «МБ» з human(), і слідом чекали `smoke_installer.py`, `verify_models.py` і
# `fetch_models.py`. `build_runtime.py` вцілів випадково — він пише в stderr, де
# обробник `backslashreplace` мовчки екранує замість падати.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    strategy:
      # Windows-збірка цінна сама по собі: якщо macOS впаде, інсталятор для
      # академії все одно має бути.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-26
            target: aarch64-apple-darwin
            bundle: dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Версію закріплено навмисно: `build_runtime.py` ставить 3.12 через uv,
      # але сам виконується хостовим Python, і покладатися на те, який саме
      # опиниться в образі раннера, — зайва змінна в збірці постачання.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Кеш cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # uv потрібен build_runtime.py: він тягне python-build-standalone і
      # ставить залежності в релоковане дерево.
      - name: uv
        uses: astral-sh/setup-uv@v5

      - name: Залежності фронтенду
        working-directory: frontend
        run: npm ci

      - name: Тести фронтенду
        working-directory: frontend
        run: npm test -- --run

      - name: Збірка фронтенду
        working-directory: frontend
        run: npm run build

      # Релокований Python з бекендом усередині. Скрипт сам перевіряє бюджет
      # (1400 МБ із worker-екстрою) і робить self-check імпортів.
      - name: Python-рантайм
        run: python scripts/build_runtime.py

      # bundle.resources у tauri.conf.json жорстко вимагає обидві теки.
      # `models` лишається порожньою: моделі не входять в інсталятор.
      - name: Порожня тека моделей
        shell: bash
        run: |
          mkdir -p src-tauri/resources/models
          touch src-tauri/resources/models/.gitkeep

      # Офлайн-інсталятор WebView2 (+127 МБ) задано в tauri.conf.json
      # (`webviewInstallMode.type`), а не тут: `downloadBootstrapper` у закритому
      # контурі просто зависає, і це рішення закріплене тестом пакування.
      - name: Збірка інсталятора
        run: npm --prefix frontend exec -- tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Бюджет розміру
        shell: bash
        run: |
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}
          # БЕЗ xargs. Він підміняє код виходу скрипта на власний 123, тобто
          # «перевищено бюджет» (1) і «немає такого шляху» (2) стають
          # нерозрізненними — саме такий 123 і стояв у логу замість причини.
          # Гірше: на порожньому вводі GNU xargs (Windows) команду все одно
          # запускає, а BSD xargs (macOS) — ні, і крок тихо зеленіє, не
          # перевіривши нічого. Прямий виклик із явною перевіркою поводиться
          # однаково на обох ОС.
          installer=$(find "$bundle" -maxdepth 1 \( -name '*-setup.exe' -o -name '*.dmg' \) | head -1)
          if [ -z "$installer" ]; then
            echo "Інсталятор не знайдено в $bundle. Вміст теки:"
            ls -la "$bundle" || echo "  теки немає"
            exit 1
          fi
          python scripts/check_size_budget.py --max-mb 900 "$installer"

      # Головний гейт: встановити зібраний інсталятор у тимчасову теку,
      # підняти застосунок і дочекатись /api/health. Ловить рівно те, чого не
      # ловить компіляція — пошкоджений рантайм, відсутній ресурс, мовчазне
      # падіння Python. Порт фіксуємо: без ASISTENT_PORT sidecar узяв би
      # переважний 8765, і тест став би чутливим до зайнятих портів раннера.
      - name: Димовий тест інсталятора
        shell: bash
        env:
          # Застосунок ad-hoc-підписаний: `signingIdentity` у tauri.conf.json немає,
          # секретів Apple у цьому workflow теж. Без цього вимикача `spctl --assess`
          # у smoke_installer.py відхилив би збірку. Це свідомий режим CI, а не
          # обхід перевірки: справжнє постачання потребує Developer ID і
          # нотаризації (docs/DEPLOY.md, розділ про Gatekeeper).
          ASISTENT_ALLOW_UNNOTARIZED: "1"
        run: |
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}
          # `find`, а НЕ `ls` з двома глобами. GitHub виконує `shell: bash` як
          # `bash -eo pipefail`, і на кожній платформі один із шаблонів нічого не
          # зіставляє: bash передає його літералом, `ls` завершується ненульовим
          # кодом, `pipefail` піднімає цей код, `-e` обриває крок — а `2>/dev/null`
          # глушить текст. Наслідок: крок падає БЕЗ ЖОДНОГО рядка діагностики, і
          # Python навіть не стартує. `find` на незіставленому шаблоні не падає.
          installer=$(find "$bundle" -maxdepth 1 \( -name '*-setup.exe' -o -name '*.dmg' \) | head -1)
          if [ -z "$installer" ]; then
            echo "Інсталятор не знайдено в $bundle. Вміст теки:"
            ls -la "$bundle" || echo "  теки немає"
            exit 1
          fi
          echo "Інсталятор: $installer"
          python scripts/smoke_installer.py --installer "$installer"

      - name: Контрольні суми
        shell: bash
        working-directory: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}
        run: |
          # Суми йдуть в акт на папері (docs/DEPLOY.md, розділ 5), тому рахуємо
          # їх ЛИШЕ з інсталятора. Голий `*` брав і підкаталог `support/`, який
          # лишає tauri-bundler: sha256sum на каталозі повертає ненульовий код,
          # а крок виконується під `bash -eo pipefail` — тобто впав би саме тут,
          # уже маючи готовий інсталятор. Заодно в акт не поїдуть хеші
          # службових файлів, яких ніхто не звірятиме.
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          find . -maxdepth 1 -type f \( -name '*-setup.exe' -o -name '*.dmg' \) -print0 \
            | xargs -0 sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: asistent-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Реліз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*
          draft: true
          body: |
            Інсталятори зібрані автоматично.

            **Моделей у файлах немає.** Каталог `models/` (~2.8 ГБ) і GGUF
            генератора постачаються окремо на носії — див. `docs/DEPLOY.md`.

            Перед встановленням звірте SHA-256 з `SHA256SUMS.txt`.
