[project]
name = "asistent-backend"
version = "0.1.0"
description = "Локальний AI-асистент викладача: приймання документів, база знань, гібридний пошук, генерація через LM Studio"
requires-python = "==3.12.*"

# Python 3.12 обрано свідомо: для нього існує кожне потрібне колесо, зокрема
# DAWG2 (швидкий шлях pymorphy3), яке зупиняється на cp312.
dependencies = [
    # --- API-процес: жодного torch. Холодний старт ~0.6 с. ---
    "fastapi>=0.118",
    "uvicorn>=0.34",
    # НЕ ОПЦІЙНА. FastAPI перевіряє наявність python-multipart у момент
    # РЕЄСТРАЦІЇ маршруту, а не при першому запиті: будь-який параметр
    # `Form(...)`/`UploadFile` (app/api/routes_documents.py) на імпорті кидає
    # RuntimeError «Form data requires python-multipart to be installed», і
    # процес падає ще до прив'язки порту. У .venv розробника пакет опинився
    # транзитивно, тож локально все працювало, а в чистому рантаймі
    # `uv pip install backend[worker]` його не було — і застосунок помирав на
    # старті вже в зібраному інсталяторі. Оголошуємо явно.
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "structlog>=25.1",

    # --- сховище ---
    "apsw>=3.53.4",          # несе власний SQLite 3.53.4; stdlib sqlite3 — робочий фолбек
    "usearch>=2.26.2",       # HNSW, mmap через Index.restore(view=True), колесо ~2 МБ
    "numpy>=1.26",

    # --- українська морфологія (лематизація ДО BM25) ---
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-uk",
    "pymorphy3-dicts-ru",
    "simplemma>=2.0",

    # --- ембединги й реранкінг: ТІЛЬКИ ONNX Runtime, без torch ---
    # sentence-transformers жорстко вимагає torch навіть із backend="onnx",
    # тому він лише у dev-групі, для скриптів експорту.
    "onnxruntime>=1.29",
    "tokenizers>=0.21",

    "blake3>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# --- worker-процес: сюди і тільки сюди потрапляє torch ---
# torch 2.14 win_amd64 = 124 МБ і ЛИШЕ CPU (CUDA-залежності мають маркер
# platform_system == 'Linux'). Багатогігабайтний слон з'являється лише якщо
# навмисно тягнути колеса з download.pytorch.org. Не тягнути.
worker = [
    "docling==2.126.0",
    "pypdfium2>=5.13",       # Apache-2.0/BSD — свідомо НЕ PyMuPDF (AGPL)
    "pypdf>=6.16",           # /PageLabels: друковані мітки сторінок
    "rapidocr>=3.9.1",
    "pillow>=11.0",
]
# macOS: Apple Vision через ocrmac, uk-UA підтримується, моделі возити не треба
worker-macos = ["ocrmac>=1.0"]

eval = [
    "ranx>=0.3.21",          # py3-none-any поверх numba; Windows-безпечно.
                             # mteb НЕ використовувати: тягне pytrec-eval-terrier,
                             # у якого немає win_amd64 колеса.
]

# `dev` — РІВНО ТЕ, ЩО СТАВИТЬ ШВИДКИЙ ГЕЙТ CI, і нічого більше.
#
# Тут лежали ще `sentence-transformers>=6.0` і `optimum[onnxruntime]>=1.24`, і
# ця пара НЕРОЗВ'ЯЗНА: кожен `optimum[onnxruntime]` гілки 1.x обмежує
# `transformers` згори (<4.49 … <4.53), а `sentence-transformers>=6.0` вимагає
# `transformers>=5.0`; гілка optimum 2.x не сходиться з ним так само. Тобто
# `pip install -e "backend[dev]"` у job `fast` падав із ResolutionImpossible на
# ПЕРШОМУ ж кроці — ще до ruff, pytest і offline_check.py. Саме тому дешевий
# гейт не спіймав відсутній `python-multipart`, хоча `helpers_api.py` імпортує
# `app.main` і впав би на збиранні тестів: він просто ніколи не виконувався.
#
# PyYAML тут не випадково: без нього `pytest.importorskip("yaml")` у
# test_packaging_tauri.py МОВЧКИ пропускає всі перевірки workflow-конфігів —
# тобто рівно ті тести, які стережуть цей файл і release.yml.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "pyyaml>=6.0",
]

# Інструменти ручного експорту ONNX на машині розробника. НІКОЛИ не в
# постачанні і НІКОЛИ в CI: тягнуть torch. Верхня межа на
# sentence-transformers — не примха, а умова розв'язності разом з optimum
# (перевірено `uv pip compile`: 5.7.0 + optimum 2.1.0 сходяться).
export = [
    "sentence-transformers>=3,<6",
    "optimum[onnxruntime]>=1.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 — «неоднозначні юнікод-символи». Правило шукає гомогліфи, якими
# маскують шкідливий код в АНГЛОМОВНИХ базах: латинська `a` проти кириличної `а`.
# Тут уся документація, коментарі й повідомлення про помилки українською за
# задумом продукту, тому воно позначає кожну другу літеру: 3448 зауважень із
# 3580, тобто 96% шуму, за яким не видно решти. Вимикаємо саме ці три, а не
# групу RUF цілком — RUF022 (несортований __all__) і RUF100 (мертві noqa)
# лишаються корисними.
ignore = [
    "RUF001", "RUF002", "RUF003",
    # UP042 пропонує замінити `class X(str, Enum)` на `StrEnum`. Для цього коду
    # це НЕ косметика: `str(DocStatus.READY)` дає «DocStatus.READY» у першому
    # випадку і «READY» у другому, а ці енуми серіалізуються в SQLite і в JSON
    # API. Міграція або тихо змінить формат збережених значень, або тихо
    # виправить латентний баг — і те, й те має відбуватися свідомо й з тестом,
    # а не автозаміною лінтера.
    "UP042",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
